# flatpak-builder manifest for Flathub.
#
# It builds from the public source repository at the beta-2 release tag.
#
# Test locally with flatpak-builder (not installed here; org.flatpak.Builder
# from Flathub also works):
#   flatpak run org.flatpak.Builder --force-clean --repo=repo builddir \
#       flatpak/io.github.zx97.SecondRealityAwakened.yml
id: io.github.zx97.SecondRealityAwakened
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: secondreality

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=xdg-run/pipewire-0

modules:
  - name: secondreality
    buildsystem: simple
    build-commands:
      - make -j${FLATPAK_BUILDER_N_JOBS:-1} all CXX=g++ CC=gcc
      - install -Dm755 _Builds/linux/secondreality /app/bin/secondreality
      - install -Dm644 flatpak/io.github.zx97.SecondRealityAwakened.desktop /app/share/applications/io.github.zx97.SecondRealityAwakened.desktop
      - install -Dm644 flatpak/io.github.zx97.SecondRealityAwakened.metainfo.xml /app/share/metainfo/io.github.zx97.SecondRealityAwakened.metainfo.xml
      - install -Dm644 flatpak/io.github.zx97.SecondRealityAwakened.png /app/share/icons/hicolor/256x256/apps/io.github.zx97.SecondRealityAwakened.png
      - install -Dm644 LICENSE.md /app/share/licenses/io.github.zx97.SecondRealityAwakened/LICENSE.md
      - install -Dm644 ThirdParty/xbrz/License.txt /app/share/licenses/io.github.zx97.SecondRealityAwakened/xbrz-GPL-3.0.txt
      - install -Dm644 flatpak/CREDITS.md /app/share/doc/secondreality/CREDITS.md
    sources:
      - type: git
        url: https://github.com/zx97/SecondRealityAwakened.git
        tag: beta-2
        commit: 6a200bed9a1a734fe76d2a2d7ecffa6585319c59
